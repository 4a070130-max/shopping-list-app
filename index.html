.splash-original{background:#a9e7f0;display:block;overflow:hidden}.splash-original img{display:block;width:100%;height:100%;object-fit:fill}.splash-original::after{content:"";position:absolute;left:16.5%;bottom:16.2%;height:2.4%;width:0;border-radius:50px;background:#f5a2bd;animation:refProgress 2.6s ease-in-out forwards;opacity:.6}@keyframes refProgress{to{width:65%}}@media(prefers-reduced-motion:reduce){.splash-original::after{animation:none;width:65%}}</style><style>.sky:before,.sky:after{content:none!important}.sky{background:linear-gradient(180deg,#cfeefa 0%,#e8f6fb 75%,#fffaf6 100%)}.cloud{position:absolute;width:84px;height:28px;background:#fff;border-radius:50px;filter:drop-shadow(0 3px 1px #b7d9e744);opacity:.94}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:39px;height:39px;left:15px;top:-19px}.cloud:after{width:31px;height:31px;left:44px;top:-13px}.cloud-one{top:43px;left:35px}.cloud-two{bottom:27px;right:20px;transform:scale(.8)}.plane-moving{width:120px;height:86px;object-fit:contain;font-size:initial;left:0;top:56%;animation:flyCute 2.5s ease-in-out forwards;filter:drop-shadow(0 4px 3px #7a9eb744)}@keyframes flyCute{0%{left:0;top:54%;transform:rotate(-12deg) scale(.83)}55%{left:36%;top:28%;transform:rotate(2deg) scale(.96)}100%{left:65%;top:6%;transform:rotate(-10deg) scale(1)}}@media(prefers-reduced-motion:reduce){.plane-moving{animation:none;left:65%;top:6%;transform:rotate(-10deg)}}.status-icon{overflow:visible}</style></head><body><header><button id="back" aria-label="返回">‹</button><h1 id="title">我的購物清單</h1><button id="search" aria-label="搜尋">⌕</button><button id="menu" aria-label="選單">⋯</button></header><main id="main"></main><button class="fab" id="add">＋ 新增</button><div id="modal"></div><div id="toast"></div><div id="travelSplash" class="splash splash-original" aria-label="準備出發"><img src="./splash-reference.jpg" alt="準備出發：可愛飛機從台灣飛往日本的天空插畫"></div><script>
'use strict';
const defaults={folders:[],items:[],trash:[],settings:{bg:'#eee9e6',general:'#c9f1f3',gift:'#f8dbea',accent:'#637f84',font:'normal',size:16,icon:'star'}};
let data=structuredClone(defaults),path=[],db=null,saveQueue=Promise.resolve(),searchText='';
const labels=['長尾山雀','喜馬拉雅貓','三角龍','魔鬼魚','蝴蝶','櫻花','太陽花','繡球花','楓葉','銀杏','蝴蝶結','愛心','星星','皇冠','棒棒糖','TAX-FREE','購物袋','勾勾','飛機','BUY'];
const icons=['bird','cat','dino','ray','butterfly','sakura','sunflower','hydrangea','maple','ginkgo','bow','heart','star','crown','lollipop','taxfree','bag','check','plane','buy'];
const categories=['動漫','藥妝','便利商店','超市','迪士尼','百貨公司','文具','服飾','生活用品','伴手禮','其他'];
const shops={'動漫':['Animate','JUMP SHOP','駿河屋','Mandarake','虎之穴','其他動漫店'],'藥妝':['松本清','SUNDRUG','大國藥妝','Welcia','COSMED','其他藥妝店'],'便利商店':['7-ELEVEN','FamilyMart 全家','Lawson','MINISTOP','其他便利商店'],'超市':['AEON','Life','西友','業務超市','其他超市'],'迪士尼':['東京迪士尼樂園','東京迪士尼海洋','迪士尼商店','其他']};
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){let el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',2900)}
async function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('shopping-list-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('app');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function load(){try{db=await openDB();let result=await new Promise((res,rej)=>{let tx=db.transaction('app','readonly');let req=tx.objectStore('app').get('state');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});if(result)data={...structuredClone(defaults),...result,settings:{...defaults.settings,...result.settings}};else{let legacy=localStorage.getItem('shopping-list-v2-backup');if(legacy){data=JSON.parse(legacy);await persist()}}}catch(e){console.error(e);notify('本機儲存功能異常，請使用 Safari 一般瀏覽模式')}cleanTrash();render()}
function persist(){let snapshot=structuredClone(data);saveQueue=saveQueue.catch(()=>{}).then(async()=>{if(!db)throw Error('資料庫尚未開啟');await new Promise((res,rej)=>{let tx=db.transaction('app','readwrite');tx.objectStore('app').put(snapshot,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})});return saveQueue.catch(e=>{console.error(e);notify('儲存失敗，請先匯出備份！');throw e})}
function cleanTrash(){const now=Date.now();data.trash=data.trash.filter(x=>now-x.deletedAt<7*864e5)}
async function change(fn){fn();render();try{await persist()}catch(e){}}
function current(){return path.at(-1)||null}
function folder(id){return data.folders.find(x=>x.id===id)}
function children(){return data.folders.filter(x=>x.parent===current()).sort((a,b)=>a.order-b.order)}
function products(){return data.items.filter(x=>x.parent===current())}
function currency(){let root=folder(path[0]);let name=root?.name||'';return /台灣|臺灣|台北|台中|高雄|台南/.test(name)?'NT$':/韓國|首爾/.test(name)?'₩':'¥'}
function render(){let s=data.settings;document.documentElement.style.setProperty('--bg',s.bg);document.documentElement.style.setProperty('--general',s.general);document.documentElement.style.setProperty('--gift',s.gift);document.documentElement.style.setProperty('--accent',s.accent);document.body.classList.toggle('font-cute',s.font==='cute');document.body.style.fontSize=s.size+'px';$('#title').textContent=folder(current())?.name||'我的購物清單';$('#back').style.visibility=path.length?'visible':'hidden';let fs=children(),it=products();let main=$('#main');let query=searchText.trim().toLowerCase();if(query){fs=data.folders.filter(f=>f.name.toLowerCase().includes(query));it=data.items.filter(i=>i.name.toLowerCase().includes(query))}let html='';if(query)html='<div class="toolbar"><button onclick="clearSearch()">✕ 清除搜尋</button></div>';if(!query&&path.length===1){let f=folder(path[0]);if(f)html+=`<div class="trip-summary"><div><b>📅 旅行日期</b><div class="date-note">${f.tripStart?escapeHTML(f.tripStart):'尚未設定'} ～ ${f.tripEnd?escapeHTML(f.tripEnd):'尚未設定'}</div></div><button id="editTripDates" type="button">設定日期</button></div>`;}
html+=fs.map(f=>`<div class="folder" data-id="${f.id}"><span class="symbol">📁</span><span class="name">${escapeHTML(f.name)}</span><button class="more" data-folder-menu="${f.id}" aria-label="管理資料夾">⋯</button></div>`).join('');
html+=it.map(i=>{let bought=!!i.completed||(i.type==='gift'&&i.qty>0&&i.bought>=i.qty);let img=i.photo?`<img class="photo" src="${i.photo}" alt="商品照片">`:'<div class="emptyphoto">🛍️</div>';return `<div class="card ${bought?'done':''} ${i.type==='gift'?'gift':''}" data-item="${i.id}">${img}<div class="details"><strong>${escapeHTML(i.name||'未命名商品')}</strong><div class="price">${escapeHTML(i.currency||currency())} ${Number(i.price||0).toLocaleString()}</div>${i.type==='gift'?`<small>🎁 ${escapeHTML(i.recipient||'未指定收件人')} · ${i.bought||0}/${i.qty||1}</small>`:''}${i.rebuy?`<span class="tag">${i.rebuy==='yes'?'❤️ 值得回購':'❌ 不再買'}</span>`:''}</div>${bought?`<img class="status-icon" style="--sticker-angle:${([...i.id].reduce((a,c)=>a+c.charCodeAt(0),0)%2)?'13deg':'-13deg'}" src="icons/${icons.includes(i.completeIcon)?i.completeIcon:(s.icon||'star')}.png" alt="購買完成">`:''}<button class="card-menu" data-item-menu="${i.id}" aria-label="商品選單">⋯</button></div>`}).join('');
if(!fs.length&&!it.length)html+=`<div class="hint">${query?'找不到符合的商品或資料夾':'這裡還沒有資料，點選「＋新增」開始吧！'}</div>`;main.innerHTML=html;let tripBtn=main.querySelector('#editTripDates');if(tripBtn)tripBtn.onclick=()=>folderName(folder(path[0]));
main.querySelectorAll('.folder').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('button'))return;path.push(el.dataset.id);searchText='';render()});let timer;el.addEventListener('touchstart',()=>{timer=setTimeout(()=>folderMenu(el.dataset.id),650)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(timer)))});
main.querySelectorAll('[data-folder-menu]').forEach(el=>el.onclick=e=>{e.stopPropagation();folderMenu(el.dataset.folderMenu)});
main.querySelectorAll('[data-item-menu]').forEach(el=>el.onclick=e=>{e.stopPropagation();itemMenu(el.dataset.itemMenu)});
main.querySelectorAll('.card').forEach(el=>{let timer,held=false;el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;held=false;timer=setTimeout(()=>{held=true;el.dataset.held='1';itemMenu(el.dataset.item)},650)});['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(timer)));el.addEventListener('contextmenu',e=>{e.preventDefault();clearTimeout(timer);if(!held){held=true;el.dataset.held='1';itemMenu(el.dataset.item)}});el.addEventListener('click',e=>{if(e.target.closest('button'))return;if(el.dataset.held==='1'){delete el.dataset.held;return}productDetail(el.dataset.item)})})}
function productDetail(id){let i=data.items.find(x=>x.id===id);if(!i)return;let done=!!i.completed||(i.type==='gift'&&i.bought>=i.qty);modal('商品詳細內容',`${i.photo?`<img class="detail-photo" id="detailphoto" src="${i.photo}" alt="點擊放大原圖">`:''}<div class="detail-info"><h3>${escapeHTML(i.name||'未命名商品')}</h3><p><b>${escapeHTML(i.currency||currency())} ${Number(i.price||0).toLocaleString()}</b></p><p>類型：${i.type==='gift'?'🎁 伴手禮':'🛍️ 一般購物'}</p>${i.type==='gift'?`<p>贈送對象：${escapeHTML(i.recipient||'未填寫')}<br>購買進度：${i.bought||0}／${i.qty||1}</p>`:''}<p>備註：${escapeHTML(i.notes||'無')}</p>${i.purchaseDate?`<p>購買日期：${escapeHTML(i.purchaseDate)}</p>`:''}${i.remindDate?`<p>提醒：${escapeHTML(i.remindDate)} ${escapeHTML(i.remindTime||'未指定時間')}</p>`:''}<p>購買狀態：${done?'已完成':'尚未完成'} ${done?`<img src="icons/${icons.includes(i.completeIcon)?i.completeIcon:'star'}.png" style="width:30px;height:30px;object-fit:contain;vertical-align:middle">`:''}</p></div><button class="primary" id="detailEdit">✏️ 修改商品</button>`);$('#detailEdit').onclick=()=>productForm(i);if(i.photo)$('#detailphoto').onclick=()=>modal('完整商品照片',`<img class="detail-photo" style="max-height:75vh" src="${i.photo}" alt="完整商品照片"><button class="primary" id="backdetail">返回詳細內容</button>`),$('#backdetail').onclick=()=>productDetail(id)}
function clearSearch(){searchText='';render()}
function modal(title,body){$('#modal').innerHTML=`<div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true"><div class="top"><h2>${escapeHTML(title)}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</section></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}
function closeModal(){$('#modal').innerHTML=''}
function choose(title,options,callback){modal(title,options.map((v,i)=>`<button class="choice" data-choice="${i}">${escapeHTML(v)}</button>`).join(''));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let v=options[+b.dataset.choice];closeModal();callback(v)})}
function addMenu(){choose('要新增什麼？',current()?['📁 新增資料夾','🛍️ 一般購物商品','🎁 伴手禮商品']:['📁 新增購物計畫'],v=>{if(v.includes('資料夾')||v.includes('計畫'))newFolder();else productForm(null,v.includes('伴手禮')?'gift':'general')})}
function newFolder(){let p=current(),depth=path.length;let parentName=folder(p)?.name;let opts=depth===1?categories:depth>=2?(shops[parentName]||['自訂名稱']):[];if(opts.length){choose('滑動選擇分類／店家',[...opts,'✏️ 自訂名稱'],v=>{if(v.includes('自訂'))folderName();else createFolder(v)})}else folderName()}
function folderName(old){modal(old?'重新命名':'新增購物計畫／資料夾',`<label class="field">名稱<input id="foldername" maxlength="50" placeholder="例如：2027 東京" value="${escapeHTML(old?.name||'')}"></label>${(!old&&path.length===0)||(old&&old.parent===null)?`<div class="row"><label class="field">旅行開始日期（選填）<input id="tripStart" type="date" value="${old?.tripStart||''}"></label><label class="field">旅行結束日期（選填）<input id="tripEnd" type="date" value="${old?.tripEnd||''}"></label></div>`:''}<button class="primary" id="savefolder">儲存</button>`);$('#savefolder').onclick=()=>{let name=$('#foldername').value.trim();if(!name)return notify('請輸入名稱');let start=$('#tripStart')?.value||'',end=$('#tripEnd')?.value||'';if(start&&end&&end<start)return notify('結束日期不能早於開始日期');closeModal();if(old)change(()=>{old.name=name;if(old.parent===null){old.tripStart=start;old.tripEnd=end}});else createFolder(name,start,end)}}
function createFolder(name,tripStart='',tripEnd=''){change(()=>data.folders.push({id:uid(),parent:current(),name,tripStart,tripEnd,order:children().length,createdAt:Date.now()}))}
function descendants(id){let ids=[id];for(let i=0;i<ids.length;i++)ids.push(...data.folders.filter(f=>f.parent===ids[i]).map(f=>f.id));return ids}
function removeFolder(f){let ids=descendants(f.id);let n=data.items.filter(i=>ids.includes(i.parent)).length;if(!confirm(`確定刪除「${f.name}」嗎？\n包含 ${ids.length-1} 個子資料夾及 ${n} 件商品，會保留在最近刪除 7 天。`))return;change(()=>{let removedFolders=data.folders.filter(x=>ids.includes(x.id));let removedItems=data.items.filter(x=>ids.includes(x.parent));data.trash.push({id:uid(),kind:'folder',deletedAt:Date.now(),folders:removedFolders,items:removedItems});data.folders=data.folders.filter(x=>!ids.includes(x.id));data.items=data.items.filter(x=>!ids.includes(x.parent));path=path.filter(x=>!ids.includes(x))})}
function folderMenu(id){let f=folder(id);if(!f)return;choose('管理資料夾：'+f.name,[...(f.parent===null?['📅 設定旅行日期']:[]),'✏️ 重新命名','⬆️ 上移','⬇️ 下移','🗑️ 刪除資料夾'],v=>{if(v.includes('旅行日期'))folderName(f);else if(v.includes('重新'))folderName(f);else if(v.includes('刪除'))removeFolder(f);else{let siblings=data.folders.filter(x=>x.parent===f.parent).sort((a,b)=>a.order-b.order),idx=siblings.findIndex(x=>x.id===id),to=idx+(v.includes('上')?-1:1);if(to<0||to>=siblings.length)return notify('已經到最前／最後');[siblings[idx],siblings[to]]=[siblings[to],siblings[idx]];change(()=>siblings.forEach((x,i)=>x.order=i))}})}
function itemMenu(id){let i=data.items.find(x=>x.id===id);if(!i)return;let options=['✏️ 修改商品',i.type==='gift'?'🎁 更新購買數量':'🎁 複製成伴手禮',i.type==='gift'?'🛍️ 複製成一般商品':'❤️ 標記值得回購','❌ 標記不要再買','🗑️ 刪除商品'];choose('商品：'+(i.name||'未命名'),options,v=>{if(v.includes('修改'))productForm(i);else if(v.includes('更新'))buyForm(i);else if(v.includes('複製'))productForm(null,i.type==='gift'?'general':'gift',i);else if(v.includes('值得'))change(()=>i.rebuy='yes');else if(v.includes('不要'))change(()=>i.rebuy='no');else if(v.includes('刪除')){if(!confirm('確定刪除這件商品嗎？可在最近刪除保留 7 天。'))return;change(()=>{data.trash.push({id:uid(),kind:'item',deletedAt:Date.now(),items:[i]});data.items=data.items.filter(x=>x.id!==id)})}})}
function buyForm(i){modal('伴手禮購買進度',`<p>${escapeHTML(i.name||'未命名商品')}，總共 ${i.qty||1} 份</p><label class="field">已購買數量<input id="bought" type="number" min="0" max="${i.qty||1}" value="${i.bought||0}"></label><button class="primary" id="savebuy">儲存</button>`);$('#savebuy').onclick=()=>{let n=Number($('#bought').value);if(!Number.isInteger(n)||n<0||n>i.qty)return notify('請輸入正確數量');closeModal();change(()=>i.bought=n)}}
async function compress(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.70))};img.onerror=()=>{URL.revokeObjectURL(url);rej(Error('無法讀取圖片'))};img.src=url})}
function productForm(item,type='general',copy=null){let v=item||copy||{},kind=item?.type||type,done=!!(item?.completed||(item?.type==='gift'&&item.bought>=item.qty));let chosen=icons.includes(item?.completeIcon)?item.completeIcon:'star';modal(item?'修改商品':'新增商品',`<label class="field">商品照片（最多 1 張）<input id="photo" type="file" accept="image/*"></label>${v.photo?'<p class="muted">已附照片，可選新照片替換</p>':''}<label class="field">商品名稱<input id="name" value="${escapeHTML(v.name||'')}" placeholder="可先只放照片"></label><div class="row"><label class="field">幣別<select id="currency"><option>¥</option><option>NT$</option><option>₩</option><option>$</option></select></label><label class="field">價格<input id="price" type="number" min="0" step="1" value="${v.price??''}"></label></div><label class="field">商品類型<select id="type"><option value="general">一般購物</option><option value="gift">伴手禮</option></select></label><div id="giftfields"><label class="field">送給誰（可填多人）<input id="recipient" value="${escapeHTML(v.recipient||'')}"></label><label class="field">總共幾份<input id="qty" type="number" min="1" value="${v.qty||1}"></label><label class="field">已購買幾份<input id="bought" type="number" min="0" value="${item?.bought||0}"></label></div><label class="field">購買日期（選填）<input id="purchaseDate" type="date" value="${v.purchaseDate||''}"></label><div class="row"><label class="field">提醒日期（選填）<input id="remindDate" type="date" value="${v.remindDate||''}"></label><label class="field">提醒時間（選填）<input id="remindTime" type="time" value="${v.remindTime||''}"></label></div><p class="muted">提醒時間會儲存在商品中。iPhone 網頁無法保證關閉後準時推播；開啟清單時可查看到期提醒。</p><label class="field">備註<textarea id="notes">${escapeHTML(v.notes||'')}</textarea></label><section class="complete-box"><label class="inline"><input id="completed" type="checkbox" ${done?'checked':''}> ☑ 已完成購買</label><div id="completeIcons" style="display:${done?'block':'none'}"><p><b>選擇這件商品的完成圖示</b></p><div class="icons">${icons.map((n,j)=>`<button type="button" data-complete-icon="${n}" title="${labels[j]}" class="${n===chosen?'active':''}"><img src="icons/${n}.png" alt="${labels[j]}"></button>`).join('')}</div></div></section><button class="primary" id="saveitem">確定並儲存商品</button>`);$('#currency').value=v.currency||currency();$('#type').value=kind;let toggle=()=>$('#giftfields').style.display=$('#type').value==='gift'?'block':'none';$('#type').onchange=toggle;toggle();$('#completed').onchange=()=>$('#completeIcons').style.display=$('#completed').checked?'block':'none';document.querySelectorAll('[data-complete-icon]').forEach(b=>b.onclick=()=>{chosen=b.dataset.completeIcon;document.querySelectorAll('[data-complete-icon]').forEach(x=>x.classList.toggle('active',x===b))});$('#saveitem').onclick=async()=>{let name=$('#name').value.trim(),file=$('#photo').files[0];if(!name&&!file&&!v.photo)return notify('請輸入商品名稱或上傳照片');let qty=Math.max(1,Number($('#qty').value)||1),bought=Math.min(qty,Math.max(0,Number($('#bought').value)||0)),completed=$('#completed').checked;if($('#type').value==='gift'&&completed)bought=qty;else if($('#type').value==='gift'&&!completed&&bought>=qty)bought=Math.max(0,qty-1);let values={name,price:Number($('#price').value)||0,currency:$('#currency').value,type:$('#type').value,recipient:$('#recipient').value.trim(),qty,bought,notes:$('#notes').value.trim(),purchaseDate:$('#purchaseDate').value,remindDate:$('#remindDate').value,remindTime:$('#remindTime').value,completed,completeIcon:chosen};if(file){try{values.photo=await compress(file)}catch(e){return notify('照片處理失敗')}}else values.photo=v.photo||null;closeModal();change(()=>{if(item)Object.assign(item,values);else data.items.push({id:uid(),parent:current(),createdAt:Date.now(),...values})})}}

function settings(){let s=data.settings;modal('外觀與圖示設定',`<label class="field">背景顏色<input id="bg" type="color" value="${s.bg}"></label><div class="row"><label class="field">一般購物顏色<input id="general" type="color" value="${s.general}"></label><label class="field">伴手禮顏色<input id="gift" type="color" value="${s.gift}"></label></div><label class="field">按鈕顏色<input id="accent" type="color" value="${s.accent}"></label><label class="field">字體風格<select id="font"><option value="normal">一般</option><option value="cute">可愛（使用裝置可用字型）</option></select></label><label class="field">字體大小<select id="size"><option value="14">小</option><option value="16">標準</option><option value="18">大</option><option value="20">特大</option></select></label><p class="muted">購買完成圖示改為每件商品獨立設定：進入商品詳細內容 → 修改 → 勾選完成。</p><p class="muted">圖案無背景；可愛字型目前依裝置可用字型顯示，與專用授權字型可能不同。</p><button class="primary" id="savesettings">儲存設定</button>`);$('#font').value=s.font;$('#size').value=s.size;$('#savesettings').onclick=()=>{let vals={bg:$('#bg').value,general:$('#general').value,gift:$('#gift').value,accent:$('#accent').value,font:$('#font').value,size:Number($('#size').value)};closeModal();change(()=>Object.assign(data.settings,vals))}}
function trash(){cleanTrash();modal('最近刪除（7 天）',data.trash.length?data.trash.map(x=>`<button class="choice" data-restore="${x.id}">↩️ 還原 ${x.kind==='folder'?'資料夾':'商品'}（${new Date(x.deletedAt).toLocaleDateString('zh-TW')}）</button>`).join(''):'<p>目前沒有可還原的資料。</p>');document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{let t=data.trash.find(x=>x.id===b.dataset.restore);if(!t)return;closeModal();change(()=>{if(t.folders){data.folders.push(...t.folders.filter(f=>!data.folders.some(x=>x.id===f.id)))}data.items.push(...(t.items||[]).filter(i=>!data.items.some(x=>x.id===i.id)));data.trash=data.trash.filter(x=>x.id!==t.id)});notify('已還原')})}
function giftList(){let items=data.items.filter(i=>i.type==='gift'&&i.bought>=i.qty);modal('🎁 購買完成',items.length?items.map(i=>`<button class="choice" data-gift="${i.id}">${escapeHTML(i.name||'未命名')} · ${escapeHTML(i.recipient||'未指定')} · ${i.bought}/${i.qty} · ${escapeHTML(folder(i.parent)?.name||'')}</button>`).join(''):'<p>目前沒有已完成的伴手禮。</p>');document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{let i=data.items.find(x=>x.id===b.dataset.gift);closeModal();buyForm(i)})}
function exportData(){let blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='購物清單備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);notify('已準備下載備份檔')}
function importData(){modal('匯入備份',`<p class="muted">匯入會取代目前的資料，請先匯出現有備份。</p><label class="field">選擇 JSON 備份<input type="file" id="backup" accept=".json,application/json"></label><button class="primary danger" id="doimport">確認取代資料</button>`);$('#doimport').onclick=async()=>{let file=$('#backup').files[0];if(!file)return notify('請先選檔');try{let v=JSON.parse(await file.text());if(!Array.isArray(v.folders)||!Array.isArray(v.items)||!v.settings)throw Error('格式不正確');if(!confirm('確定用備份取代目前所有資料嗎？'))return;closeModal();await change(()=>{data={...structuredClone(defaults),...v,settings:{...defaults.settings,...v.settings}};path=[]});notify('匯入完成')}catch(e){notify('備份檔案格式錯誤')}}}
function menu(){choose('更多功能',['🎨 外觀與完成圖示','🎁 購買完成','🗑️ 最近刪除（7 天）','⬇️ 匯出資料備份','⬆️ 匯入資料備份','📁 管理目前資料夾'],v=>{if(v.includes('外觀'))settings();else if(v.includes('購買完成'))giftList();else if(v.includes('最近'))trash();else if(v.includes('匯出'))exportData();else if(v.includes('匯入'))importData();else if(v.includes('管理'))current()?folderMenu(current()):notify('請先進入資料夾')})}
$('#back').onclick=()=>{if(path.length)path.pop();searchText='';render()};$('#add').onclick=addMenu;$('#menu').onclick=menu;$('#search').onclick=()=>{modal('搜尋商品與資料夾','<input class="searchbar" id="query" placeholder="輸入商品名稱或資料夾名稱"><button class="primary" id="dosearch">搜尋</button>');$('#query').value=searchText;$('#dosearch').onclick=()=>{searchText=$('#query').value;closeModal();render()};$('#query').onkeydown=e=>{if(e.key==='Enter')$('#dosearch').click()}};
window.addEventListener('pageshow',e=>{if(e.persisted)render()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});window.addEventListener('pagehide',()=>{if(db&&saveQueue)saveQueue.catch(()=>{})});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));load();let splash=$('#travelSplash');let splashTimer=setTimeout(()=>{splash?.classList.add('hide');setTimeout(()=>splash?.remove(),450)},2800);splash?.addEventListener('click',()=>{clearTimeout(splashTimer);splash.classList.add('hide');setTimeout(()=>splash.remove(),450)});
</script></body></html>
