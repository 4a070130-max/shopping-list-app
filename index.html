<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8e6e0"><link rel="manifest" href="manifest.webmanifest"><title>我的購物清單</title><style>
:root{--bg:#e8e6e0;--card:#fffdf9;--ink:#343638;--muted:#777;--general:#a9c0c9;--gift:#d9b5b1;--size:17px}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;font-size:var(--size);background:var(--bg);background-size:cover;background-position:center;background-attachment:fixed}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#fffdf9ee;backdrop-filter:blur(8px);border-bottom:1px solid #ddd;padding:env(safe-area-inset-top) 12px 10px;min-height:65px;display:flex;align-items:end;gap:8px}header h1{font-size:1.1em;flex:1;margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon{border:0;background:transparent;font-size:25px;min-width:36px;min-height:40px;color:#353535}.screen{max-width:680px;margin:auto;padding:15px 13px 110px}.tile,.item{background:var(--card);border-radius:15px;margin:0 0 10px;box-shadow:0 2px 8px #00000012;overflow:hidden}.tile{padding:17px;display:flex;justify-content:space-between;align-items:center;gap:12px}.item{display:flex;align-items:stretch;min-height:94px;border-bottom:9px solid var(--general)}.item.gift{border-bottom-color:var(--gift)}.item img,.thumb{width:105px;height:90px;object-fit:cover;background:#eee;flex-shrink:0}.item .info{padding:12px;display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}.item .name{font-weight:700;overflow-wrap:anywhere}.item .price{font-size:1.05em}.muted{color:var(--muted);font-size:.85em}.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:max(18px,calc((100vw - 650px)/2));border:0;border-radius:40px;background:#5e797f;color:white;padding:15px 21px;box-shadow:0 4px 15px #0003;z-index:3}.panel{background:#fffdf9;border-radius:18px;padding:18px;margin:0 0 13px}.panel h2{font-size:1.05em;margin:0 0 15px}.field{display:block;margin:12px 0}.field>span{display:block;font-weight:650;margin-bottom:6px}input:not([type=checkbox]):not([type=color]),select,textarea{width:100%;border:1px solid #ccc;background:white;border-radius:10px;padding:11px;min-height:44px}input[type=color]{width:70px;height:45px;border:0;background:none}.primary,.secondary,.danger{border:0;border-radius:12px;padding:13px 16px;margin:5px 5px 5px 0}.primary{background:#5e797f;color:white}.secondary{background:#e8e6e0}.danger{background:#f4d9d6;color:#8b3333}.photo{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#f0f0ee}.largephoto{max-height:60vh}.actions{display:flex;flex-wrap:wrap;gap:6px}.search{margin-bottom:15px}.empty{text-align:center;color:#666;padding:55px 15px}.overlay{position:fixed;inset:0;background:#0007;z-index:10;display:flex;align-items:end;justify-content:center}.sheet{width:min(680px,100%);max-height:85vh;overflow:auto;background:#fffdf9;border-radius:20px 20px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet button{display:block;width:100%;margin:7px 0;text-align:left}.close{float:right}.pill{display:inline-block;padding:5px 10px;border-radius:12px;background:#e9eeee;font-size:.85em}.dragging{opacity:.4}.note{font-size:.85em;line-height:1.5;color:#666}a{color:#476b77} .row{display:flex;align-items:center;gap:12px} .row>*{flex:1} @media(min-width:700px){header{padding-left:max(20px,calc((100vw - 680px)/2));padding-right:max(20px,calc((100vw - 680px)/2))}}
</style></head><body><header><button id="back" class="icon" aria-label="返回">←</button><h1 id="title">我的購物清單</h1><button id="searchBtn" class="icon" aria-label="搜尋">⌕</button><button id="menuBtn" class="icon" aria-label="更多">⋯</button></header><main id="main" class="screen"></main><button id="add" class="fab">＋ 新增</button><div id="modal"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const KEY='shopping-pwa-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{plans:[],cats:[],stores:[],items:[],deleted:[],settings:{general:'#a9c0c9',gift:'#d9b5b1',bg:'#e8e6e0',font:'normal',size:17}};let stack=[{page:'home'}],query='',editing=null;const state=()=>stack.at(-1),id=()=>crypto.randomUUID(),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));applyTheme()},go=(page,extra={})=>{stack.push({page,...extra});query='';render()},back=()=>{if(stack.length>1){stack.pop();query='';render()}},lookup=(kind,k)=>db[kind].find(x=>x.id===k),fmt=n=>Number(n||0).toLocaleString(),currentStore=()=>lookup('stores',state().store),currentPlan=()=>{let s=state();if(s.page==='plans')return lookup('plans',s.plan);if(s.page==='cats')return lookup('plans',lookup('cats',s.cat)?.plan);if(['store','detail','edit'].includes(s.page)){let item=lookup('items',s.item),store=lookup('stores',s.store||item?.store),cat=lookup('cats',store?.cat);return lookup('plans',cat?.plan)}return null};function applyTheme(){let s=db.settings;document.documentElement.style.setProperty('--bg',s.bg);document.documentElement.style.setProperty('--general',s.general);document.documentElement.style.setProperty('--gift',s.gift);document.documentElement.style.setProperty('--size',s.size+'px');document.body.style.backgroundImage=s.bgImage?'url('+s.bgImage+')':'none';document.body.style.fontFamily=s.font==='cute'?"'Comic Sans MS',system-ui,sans-serif":"system-ui,-apple-system,sans-serif"}function render(){applyTheme();let s=state(),t='',html='',add=true;$('#back').style.visibility=stack.length===1?'hidden':'visible';$('#searchBtn').style.display=['home','plans','cats','store'].includes(s.page)?'':'none';$('#menuBtn').style.display='';if(s.page==='home'){t='我的購物清單';html=listTiles(db.plans,'plans')}if(s.page==='plans'){let p=lookup('plans',s.plan);t=p?.name||'購物計畫';html=listTiles(db.cats.filter(x=>x.plan===s.plan),'cats')}if(s.page==='cats'){let c=lookup('cats',s.cat);t=c?.name||'分類';html=listTiles(db.stores.filter(x=>x.cat===s.cat),'store')}if(s.page==='store'){let st=currentStore();t=st?.name||'店家';html=listItems(db.items.filter(x=>x.store===s.store))}if(s.page==='detail'){let x=lookup('items',s.item);t='商品詳細資料';add=false;html=x?`<section class="panel">${x.photo?`<img class="photo largephoto" src="${x.photo}" onclick="zoom('${x.id}')" alt="商品照片">`:''}<h2>${esc(x.name||'未命名商品')}</h2><p><strong>${esc(x.currency||'¥')} ${fmt(x.price)}</strong></p><p><span class="pill">${x.type==='gift'?'🎁 伴手禮':'🛍️ 一般購物'}</span></p>${x.type==='gift'?`<p>贈送對象：${esc(x.recipient||'未填寫')}</p><p>需要數量：${fmt(x.qty||1)}</p><p>已購數量：${fmt(x.bought||0)}</p><button class="secondary" onclick="changeBought('${x.id}',1)">＋ 已購一件</button><button class="secondary" onclick="changeBought('${x.id}',-1)">－ 撤銷一件</button>`:''}<p>備註：${esc(x.notes||'無')}</p><div class="actions"><button class="primary" onclick="go('edit',{item:'${x.id}'})">✏️ 編輯</button><button class="secondary" onclick="duplicate('${x.id}')">複製至${x.type==='gift'?'一般購物':'伴手禮'}</button><button class="danger" onclick="removeItem('${x.id}')">刪除</button></div></section>`:''}if(s.page==='edit'){t=s.item?'修改商品':'新增商品';add=false;html=editForm(s.item)}if(s.page==='settings'){t='外觀與語言';add=false;html=settingsForm()}if(s.page==='deleted'){t='最近刪除（7 天）';add=false;let valid=db.deleted.filter(x=>Date.now()-x.deletedAt<7*864e5);html=valid.map(x=>`<div class="tile"><span>${esc(x.name||'未命名')}</span><button class="secondary" onclick="restore('${x.id}')">復原</button></div>`).join('')||'<div class="empty">沒有最近刪除的商品</div>'}if(s.page==='done'){t='🎁 購買完成';add=false;html=listItems(db.items.filter(x=>x.type==='gift'&&x.qty>0&&x.bought>=x.qty))}if(s.page==='rebuy'){t='❤️ 值得回購';add=false;html=listItems(db.items.filter(x=>x.rebuy==='yes'))}$('#title').textContent=t;$('#main').innerHTML=html||'<div class="empty">這裡還沒有資料，點選「＋ 新增」開始吧！</div>';$('#add').style.display=add?'':'none';if(query&&['home','plans','cats','store'].includes(s.page)){let inp=document.createElement('input');inp.className='search';inp.placeholder='搜尋名稱…';inp.value=query;inp.oninput=e=>{query=e.target.value;filterVisible()};$('#main').prepend(inp);filterVisible()} }
function listTiles(xs,target){return xs.map(x=>`<div class="tile searchable" draggable="true" data-id="${x.id}" data-name="${esc(x.name)}" onclick="go('${target}',{${target==='plans'?'plan':target==='cats'?'cat':'store'}:'${x.id}'})"><strong>📁 ${esc(x.name)}</strong><span class="muted">☰ 拖曳排序　›</span></div>`).join('')}function listItems(xs){return xs.map(x=>`<article class="item searchable ${x.type==='gift'?'gift':''}" data-name="${esc(x.name)}" onclick="go('detail',{item:'${x.id}',store:'${x.store}'})" oncontextmenu="event.preventDefault();itemMenu('${x.id}')">${x.photo?`<img src="${x.photo}" alt="商品照片">`:'<div class="thumb"></div>'}<div class="info"><div class="name">${esc(x.name||'未命名商品')}</div><div class="price">${esc(x.currency||'¥')} ${fmt(x.price)}</div></div></article>`).join('')}function filterVisible(){document.querySelectorAll('.searchable').forEach(el=>el.style.display=(el.dataset.name||'').toLowerCase().includes(query.toLowerCase())?'':'none')}
function sheet(title,body){$('#modal').innerHTML=`<div class="overlay" onclick="closeSheet(event)"><div class="sheet"><button class="icon close" onclick="closeSheet()">×</button><h2>${esc(title)}</h2>${body}</div></div>`}function closeSheet(e){if(e&&e.target!==$('.overlay'))return;$('#modal').innerHTML=''}function askNew(){let s=state();if(s.page==='store')sheet('新增商品',`<button class="secondary" onclick="closeSheet();go('edit',{store:'${s.store}',type:'normal'})">🛍️ 一般購物</button><button class="secondary" onclick="closeSheet();go('edit',{store:'${s.store}',type:'gift'})">🎁 伴手禮</button>`);else sheet('新增資料夾',`<label class="field"><span>名稱</span><input id="newName" placeholder="輸入名稱"></label><button class="primary" onclick="createFolder()">建立</button>${s.page==='plans'?'<p class="note">常用分類：便利商店、動漫、超市、藥妝店</p>':''}`)}function createFolder(){let name=$('#newName').value.trim();if(!name)return alert('請輸入名稱');let s=state();if(s.page==='home')db.plans.push({id:id(),name});else if(s.page==='plans')db.cats.push({id:id(),name,plan:s.plan});else db.stores.push({id:id(),name,cat:s.cat});save();closeSheet();render()}
function editForm(key){let x=lookup('items',key)||{type:state().type||'normal',store:state().store,name:'',price:'',currency:currentPlan()?.currency||'¥',qty:1,bought:0};editing={...x};return `<form class="panel" id="itemForm"><label class="field"><span>商品照片（1 張）</span><input type="file" accept="image/*" id="photoInput"></label>${x.photo?`<img class="photo" id="preview" src="${x.photo}">`:'<img class="photo" id="preview" style="display:none">'}<label class="field"><span>商品名稱（可留空）</span><input name="name" value="${esc(x.name)}"></label><div class="row"><label class="field"><span>幣別</span><select name="currency"><option ${x.currency==='¥'?'selected':''}>¥</option><option ${x.currency==='NT$'?'selected':''}>NT$</option><option ${x.currency==='$'?'selected':''}>$</option><option ${x.currency==='₩'?'selected':''}>₩</option></select></label><label class="field"><span>價格</span><input type="number" min="0" step="any" name="price" value="${esc(x.price)}"></label></div><label class="field"><span>類型</span><select name="type" id="typeSelect"><option value="normal" ${x.type==='normal'?'selected':''}>一般購物</option><option value="gift" ${x.type==='gift'?'selected':''}>伴手禮</option></select></label><div id="giftFields" style="display:${x.type==='gift'?'block':'none'}"><label class="field"><span>贈送對象</span><input name="recipient" value="${esc(x.recipient||'')}"></label><label class="field"><span>需要數量</span><input type="number" min="1" name="qty" value="${x.qty||1}"></label><label class="field"><span>已購數量</span><input type="number" min="0" name="bought" value="${x.bought||0}"></label></div><label class="field"><span>備註</span><textarea name="notes">${esc(x.notes||'')}</textarea></label><button type="submit" class="primary">儲存商品</button><button type="button" class="secondary" onclick="back()">取消</button></form>`}function settingsForm(){let s=db.settings;return `<section class="panel"><h2>背景（全 App 共用）</h2><label class="field"><span>純色背景</span><input type="color" id="bg" value="${s.bg}"></label><label class="field"><span>自行上傳背景圖片</span><input type="file" accept="image/*" id="bgUpload"></label><button class="secondary" onclick="delete db.settings.bgImage;save();render()">移除背景圖片</button></section><section class="panel"><h2>商品類型顏色</h2><label class="field"><span>一般購物</span><input type="color" id="general" value="${s.general}"></label><label class="field"><span>伴手禮</span><input type="color" id="gift" value="${s.gift}"></label></section><section class="panel"><h2>文字設定</h2><label class="field"><span>字體風格</span><select id="font"><option value="normal" ${s.font==='normal'?'selected':''}>一般</option><option value="cute" ${s.font==='cute'?'selected':''}>可愛（裝置預設暫代）</option></select></label><label class="field"><span>字體大小</span><select id="size">${[15,17,20,23].map((n,i)=>`<option value="${n}" ${s.size===n?'selected':''}>${['小','標準','大','特大'][i]}</option>`).join('')}</select></label><p class="note">正式版將整合已確認授權的中、英、日文字型。目前為可操作測試版，使用裝置字型暫代。</p></section><button class="primary" onclick="saveSettings()">儲存設定</button>`}function saveSettings(){for(let k of ['bg','general','gift','font','size'])db.settings[k]=$('#'+k).value;db.settings.size=Number(db.settings.size);save();render();alert('已儲存')}
function itemMenu(key){sheet('商品操作',`<button class="secondary" onclick="closeSheet();go('edit',{item:'${key}'})">✏️ 修改商品</button><button class="secondary" onclick="closeSheet();duplicate('${key}')">複製至另一類型</button><button class="secondary" onclick="closeSheet();toggleRebuy('${key}')">❤️ 值得回購／❌ 不再購買</button><button class="danger" onclick="closeSheet();removeItem('${key}')">刪除商品</button>`)}function duplicate(key){let x=lookup('items',key);if(!x)return;let y={...x,id:id(),type:x.type==='gift'?'normal':'gift',recipient:'',qty:1,bought:0};db.items.push(y);save();alert('已新增相同商品');render()}function removeItem(key){if(!confirm('確定要刪除此商品嗎？商品將保留在最近刪除 7 天。'))return;let i=db.items.findIndex(x=>x.id===key);if(i<0)return;db.deleted.push({...db.items.splice(i,1)[0],deletedAt:Date.now()});save();if(state().page==='detail')back();else render()}function restore(key){let i=db.deleted.findIndex(x=>x.id===key);if(i<0)return;let x=db.deleted.splice(i,1)[0];delete x.deletedAt;db.items.push(x);save();render()}function changeBought(key,n){let x=lookup('items',key);x.bought=Math.max(0,Math.min(Number(x.qty||1),Number(x.bought||0)+n));save();render()}function toggleRebuy(key){let x=lookup('items',key);x.rebuy=x.rebuy==='yes'?'no':'yes';save();render()}function zoom(key){let x=lookup('items',key);if(x?.photo)sheet('商品照片',`<img class="photo largephoto" src="${x.photo}">`)}
function exportImage(){let s=state(),xs=s.page==='store'?db.items.filter(x=>x.store===s.store):db.items;if(!xs.length)return alert('沒有可匯出的商品');let c=document.createElement('canvas'),w=800,row=145;c.width=w;c.height=110+row*xs.length;let g=c.getContext('2d');g.fillStyle='#fffdf9';g.fillRect(0,0,w,c.height);g.fillStyle='#333';g.font='bold 36px sans-serif';g.fillText($('#title').textContent,30,60);let load=xs.map(x=>new Promise(resolve=>{if(!x.photo)return resolve(null);let im=new Image;im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=x.photo}));Promise.all(load).then(imgs=>{xs.forEach((x,i)=>{let y=100+i*row;g.fillStyle=x.type==='gift'?db.settings.gift:db.settings.general;g.fillRect(20,y+126,760,8);g.fillStyle='#f3f1ee';g.fillRect(20,y,130,122);if(imgs[i]){let im=imgs[i],ratio=Math.min(130/im.width,122/im.height);g.drawImage(im,20+(130-im.width*ratio)/2,y+(122-im.height*ratio)/2,im.width*ratio,im.height*ratio)}g.fillStyle='#333';g.font='bold 26px sans-serif';g.fillText((x.name||'未命名商品').slice(0,24),175,y+50);g.font='26px sans-serif';g.fillText((x.currency||'¥')+' '+fmt(x.price),175,y+100)});c.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='購物清單.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)})})}function calendarReminder(){let name=prompt('提醒事項名稱','記得購買伴手禮');if(!name)return;let when=prompt('提醒日期時間（格式：2027-01-04 16:30）','2027-01-04 16:30');if(!when)return;let d=new Date(when.replace(' ','T'));if(isNaN(d))return alert('日期格式不正確');let pad=n=>String(n).padStart(2,'0'),dt=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+'T'+pad(x.getHours())+pad(x.getMinutes())+'00';let end=new Date(d.getTime()+15*60000),ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Shopping PWA//ZH\r\nBEGIN:VEVENT\r\nUID:${id()}@shopping-pwa\r\nDTSTART:${dt(d)}\r\nDTEND:${dt(end)}\r\nSUMMARY:${name.replace(/[\n,;]/g,' ')}\r\nBEGIN:VALARM\r\nTRIGGER:-PT5M\r\nACTION:DISPLAY\r\nDESCRIPTION:購物提醒\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='購物提醒.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);alert('已產生行事曆檔案，請開啟並確認加入行事曆；是否成功匯入依手機系統而定。')}
$('#back').onclick=back;$('#add').onclick=askNew;$('#searchBtn').onclick=()=>{query=' ';render();$('.search')?.focus()};$('#menuBtn').onclick=()=>sheet('更多功能',`<button class="secondary" onclick="closeSheet();go('settings')">🎨 外觀與文字設定</button><button class="secondary" onclick="closeSheet();go('done')">🎁 購買完成</button><button class="secondary" onclick="closeSheet();go('rebuy')">❤️ 值得回購</button><button class="secondary" onclick="closeSheet();go('deleted')">🗑️ 最近刪除</button><button class="secondary" onclick="closeSheet();calendarReminder()">📅 加入行事曆提醒</button><button class="secondary" onclick="closeSheet();exportImage()">📸 匯出商品長圖</button><p class="note">本測試版資料儲存在此裝置的瀏覽器中。清除網站資料可能造成資料遺失。</p>`);
document.addEventListener('change',async e=>{if(e.target.id==='typeSelect')$('#giftFields').style.display=e.target.value==='gift'?'block':'none';if(e.target.id==='photoInput'||e.target.id==='bgUpload'){let f=e.target.files[0];if(!f)return;let im=new Image,src=URL.createObjectURL(f);im.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.7);if(e.target.id==='photoInput'){editing.photo=data;$('#preview').src=data;$('#preview').style.display='block'}else{db.settings.bgImage=data;save();render()}URL.revokeObjectURL(src)};im.src=src}});
document.addEventListener('submit',e=>{if(e.target.id!=='itemForm')return;e.preventDefault();let form=e.target,d=Object.fromEntries(new FormData(form).entries());let x={...editing,...d,id:editing.id||id(),store:editing.store||state().store,qty:Math.max(1,Number(d.qty)||1),bought:Math.max(0,Number(d.bought)||0),price:Number(d.price)||0};if(x.type==='normal'){x.recipient='';x.bought=0}let i=db.items.findIndex(v=>v.id===x.id);if(i>=0)db.items[i]=x;else db.items.push(x);try{save()}catch{alert('儲存空間不足，請改用較小照片');return}back()});let dragId=null;document.addEventListener('dragstart',e=>{let tile=e.target.closest('.tile[draggable]');if(tile){dragId=tile.dataset.id;tile.classList.add('dragging')}});document.addEventListener('dragend',e=>e.target.closest('.tile')?.classList.remove('dragging'));document.addEventListener('dragover',e=>{if(e.target.closest('.tile'))e.preventDefault()});document.addEventListener('drop',e=>{let tile=e.target.closest('.tile');if(!tile||!dragId||dragId===tile.dataset.id)return;e.preventDefault();let s=state(),arr=s.page==='home'?db.plans:s.page==='plans'?db.cats:db.stores;let a=arr.findIndex(x=>x.id===dragId),b=arr.findIndex(x=>x.id===tile.dataset.id);if(a<0||b<0)return;arr.splice(b,0,arr.splice(a,1)[0]);dragId=null;save();render()});db.deleted=db.deleted.filter(x=>Date.now()-x.deletedAt<7*864e5);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
